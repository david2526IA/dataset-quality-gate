[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-quality-gate"
version = "0.1.0"
description = "Schema-driven CSV quality gate with auditable accepted and rejected records."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "David"}]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dataset-quality-gate = "dataset_quality_gate.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
